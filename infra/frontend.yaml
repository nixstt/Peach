AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Spry frontend. A private S3 bucket holds the Vite build. A Lambda function
  URL serves it over HTTPS. This account cannot create CloudFront distributions
  until AWS verifies it, and a function URL needs no domain of our own.

Parameters:
  ProjectName:
    Type: String
    Default: spry

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${ProjectName}-frontend-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  ReaderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-frontend-reader"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: read-site
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${Bucket.Arn}/*"

  Reader:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-frontend"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ReaderRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          BUCKET: !Ref Bucket
      Code:
        ZipFile: |
          import base64
          import os
          import boto3
          from botocore.exceptions import ClientError
          s3 = boto3.client("s3")
          def handler(event, context):
              path = (event.get("rawPath") or "/").split("?", 1)[0]
              key = "index.html" if path in ("", "/") else path.lstrip("/")
              bucket = os.environ["BUCKET"]
              try:
                  obj = s3.get_object(Bucket=bucket, Key=key)
              except ClientError:
                  if key == "index.html":
                      return {"statusCode": 404, "headers": {"Content-Type": "text/plain"}, "body": "not found"}
                  obj = s3.get_object(Bucket=bucket, Key="index.html")
                  key = "index.html"
              body = obj["Body"].read()
              content_type = obj.get("ContentType") or "application/octet-stream"
              cache = obj.get("CacheControl") or "no-cache"
              return {
                  "statusCode": 200,
                  "headers": {"Content-Type": content_type, "Cache-Control": cache},
                  "body": base64.b64encode(body).decode("ascii"),
                  "isBase64Encoded": True,
              }

  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref Reader
      AuthType: NONE

  PublicInvokeUrl:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Reader
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  PublicInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Reader
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  SiteUrl:
    Value: !GetAtt FunctionUrl.FunctionUrl
  BucketName:
    Value: !Ref Bucket
