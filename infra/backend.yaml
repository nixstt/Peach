AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Spry API. Fargate runs the backend image behind an internet-facing load
  balancer. Postgres is RDS in the same VPC, reachable only from the tasks.
  No NAT gateway: tasks have a public IP so they can pull from ECR, and their
  security group accepts port 8000 only from the load balancer.

Parameters:
  ProjectName:
    Type: String
    Default: spry
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  ImageUri:
    Type: String
    Description: ECR image URI including the commit SHA tag.
  DesiredCount:
    Type: Number
    Default: 1
  EngineVersion:
    Type: String
    Description: RDS Postgres 16 minor version, for example 16.8.
  DbPasswordSecretArn:
    Type: String
  CorsOrigins:
    Type: String
    Default: http://localhost:3000
  CertificateArn:
    Type: String
    Default: ""
  ApiDomain:
    Type: String
    Default: ""
  HostedZoneId:
    Type: String
    Default: ""
  CognitoUserPoolId:
    Type: String
    Default: ""
    Description: Cognito user pool ID for JWT verification.
  CognitoClientId:
    Type: String
    Default: ""
    Description: Cognito app client ID for JWT verification.
  ReportsDomain:
    Type: String
    Description: Domain that SES will verify for the report sender.
  ReportRecipients:
    Type: String
    Description: Comma-separated verified email addresses that receive reports.
  RouteTableIds:
    Type: CommaDelimitedList
    Description: Route tables used by Lambda subnets for the S3 gateway endpoint.

Conditions:
  HasCert: !Not [!Equals [!Ref CertificateArn, ""]]
  HasDomain: !And
    - !Condition HasCert
    - !Not [!Equals [!Ref ApiDomain, ""]]
  HasZone: !And
    - !Condition HasDomain
    - !Not [!Equals [!Ref HostedZoneId, ""]]

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}-backend"
      RetentionInDays: 7

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-execution"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-db-password
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DbPasswordSecretArn

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-task"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ProjectName

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-backend"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: backend
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - Name: CORS_ORIGINS
              Value: !Ref CorsOrigins
            - Name: DB_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: DB_PORT
              Value: "5432"
            - Name: DB_NAME
              Value: spry
            - Name: DB_USER
              Value: postgres
            - Name: COGNITO_USER_POOL_ID
              Value: !Ref CognitoUserPoolId
            - Name: COGNITO_CLIENT_ID
              Value: !Ref CognitoClientId
            - Name: AWS_REGION
              Value: !Ref AWS::Region
          Secrets:
            - Name: DB_PASSWORD
              ValueFrom: !Ref DbPasswordSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend
          HealthCheck:
            Command:
              - CMD-SHELL
              - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 90

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} load balancer"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} tasks"
      VpcId: !Ref VpcId

  ServiceIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ServiceSecurityGroup
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
      SourceSecurityGroupId: !Ref AlbSecurityGroup

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} database"
      VpcId: !Ref VpcId

  DbIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DbSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref ServiceSecurityGroup

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub "${ProjectName}-db"
      DBSubnetGroupDescription: !Sub "${ProjectName} database"
      SubnetIds: !Ref PublicSubnetIds

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-db"
      Engine: postgres
      EngineVersion: !Ref EngineVersion
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      MasterUsername: postgres
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DbPasswordSecretArn}:SecretString}}"
      DBName: spry
      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      DBSubnetGroupName: !Ref DbSubnetGroup
      PubliclyAccessible: false
      BackupRetentionPeriod: 1
      DeleteAutomatedBackups: true
      DeletionProtection: false
      MultiAZ: false
      EnablePerformanceInsights: false
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-alb"
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets: !Ref PublicSubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroup

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-backend"
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8000
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - HasCert
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: "443"
              StatusCode: HTTP_301
          - Type: forward
            TargetGroupArn: !Ref TargetGroup

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCert
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      ServiceName: !Sub "${ProjectName}-backend"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref PublicSubnetIds
          SecurityGroups:
            - !Ref ServiceSecurityGroup
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: 8000
          TargetGroupArn: !Ref TargetGroup

  ApiAlias:
    Type: AWS::Route53::RecordSet
    Condition: HasZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApiDomain
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: false

  # HTTPS without a domain we own. API Gateway's default hostname has a
  # certificate. The load balancer stays on HTTP and is only the integration target.
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-api"
      ProtocolType: HTTP
      Tags:
        PROJECT_NAME: !Ref ProjectName

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      PayloadFormatVersion: "1.0"
      IntegrationUri: !Sub "http://${LoadBalancer.DNSName}/{proxy}"

  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "ANY /{proxy+}"
      Target: !Sub "integrations/${ApiIntegration}"

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  ReportsBucket:
    Type: AWS::S3::Bucket
    DependsOn: ReportMailerPermission
    Properties:
      BucketName: !Sub "${ProjectName}-reports-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-reports-after-90-days
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: 90
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt ReportMailerFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: reports/
                  - Name: suffix
                    Value: .csv

  ReportsS3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Gateway
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      RouteTableIds: !Ref RouteTableIds

  ReportRequestsDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests-dlq"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  ReportRequestsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests"
      VisibilityTimeout: 600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReportRequestsDlq.Arn
        maxReceiveCount: 3

  ReportBuilderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-report-builder"
      RetentionInDays: 30

  ReportBuilderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-report-builder"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: write-report-objects
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*"
        - PolicyName: consume-report-requests
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource: !GetAtt ReportRequestsQueue.Arn

  ReportBuilderFunction:
    Type: AWS::Lambda::Function
    DependsOn: ReportBuilderLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-report-builder"
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - app.reports.lambda_handler.handler
      Role: !GetAtt ReportBuilderRole.Arn
      Timeout: 90
      MemorySize: 512
      VpcConfig:
        SubnetIds: !Ref PublicSubnetIds
        SecurityGroupIds:
          - !Ref ServiceSecurityGroup
      Environment:
        Variables:
          DB_HOST: !GetAtt Database.Endpoint.Address
          DB_PORT: "5432"
          DB_NAME: spry
          DB_USER: postgres
          DB_PASSWORD: !Sub "{{resolve:secretsmanager:${DbPasswordSecretArn}:SecretString}}"
          REPORTS_BUCKET: !Ref ReportsBucket

  ReportBuilderScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-report-schedule"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: enqueue-scheduled-report
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ReportRequestsQueue.Arn

  ReportWeeklySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ProjectName}-weekly-report"
      Description: Request the previous ISO week's meeting report every Monday morning.
      State: ENABLED
      ScheduleExpression: cron(0 7 ? * MON *)
      ScheduleExpressionTimezone: Europe/Kyiv
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt ReportRequestsQueue.Arn
        RoleArn: !GetAtt ReportBuilderScheduleRole.Arn
        Input: '{"week": null, "source": "schedule"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 3

  ReportOutboxScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-report-outbox-schedule"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-report-outbox-poller
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ReportBuilderFunction.Arn

  ReportOutboxSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ProjectName}-report-outbox-poller"
      Description: Poll durable in-database report requests.
      State: ENABLED
      ScheduleExpression: rate(5 minutes)
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt ReportBuilderFunction.Arn
        RoleArn: !GetAtt ReportOutboxScheduleRole.Arn
        Input: '{"source": "outbox-poller"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 3

  ReportBuilderEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ReportRequestsQueue.Arn
      FunctionName: !Ref ReportBuilderFunction
      BatchSize: 1
      Enabled: true

  ReportMailerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-report-mailer"
      RetentionInDays: 30

  ReportMailerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-report-mailer"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: read-reports-and-send
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*"
              - Effect: Allow
                Action: ses:SendEmail
                Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${ReportsDomain}"

  ReportMailerFunction:
    Type: AWS::Lambda::Function
    DependsOn: ReportMailerLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-report-mailer"
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - app.mailer.handler
      Role: !GetAtt ReportMailerRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          REPORT_SENDER: !Sub "reports@${ReportsDomain}"
          REPORT_RECIPIENTS: !Ref ReportRecipients

  ReportMailerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ReportMailerFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}"
      SourceAccount: !Ref AWS::AccountId

  ReportsEmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref ReportsDomain

Outputs:
  ApiUrl:
    Value: !If
      - HasDomain
      - !Sub "https://${ApiDomain}"
      - !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  AlbDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  ReportsBucketName:
    Value: !Ref ReportsBucket
  ReportRequestsQueueUrl:
    Value: !Ref ReportRequestsQueue
  ReportRequestsDlqUrl:
    Value: !Ref ReportRequestsDlq
  ReportsDkimTokenName1:
    Value: !GetAtt ReportsEmailIdentity.DkimDNSTokenName1
  ReportsDkimTokenValue1:
    Value: !GetAtt ReportsEmailIdentity.DkimDNSTokenValue1
  ReportsDkimTokenName2:
    Value: !GetAtt ReportsEmailIdentity.DkimDNSTokenName2
  ReportsDkimTokenValue2:
    Value: !GetAtt ReportsEmailIdentity.DkimDNSTokenValue2
  ReportsDkimTokenName3:
    Value: !GetAtt ReportsEmailIdentity.DkimDNSTokenName3
  ReportsDkimTokenValue3:
    Value: !GetAtt ReportsEmailIdentity.DkimDNSTokenValue3
